{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card">
        <h2>🧾 Generate Operational Runbook</h2>
        <p>Answer guided questions and generate a structured enterprise runbook.</p>
    </div>

    <label><b>Select Runbook Type:</b></label><br>

    <select id="runbook-type">
        <option value="process">Process Documentation</option>
        <option value="incident">Incident / Troubleshooting</option>
    </select>

    <br><br>

    <input type="text"
           id="runbook_title"
           placeholder="Enter runbook title" />

    <br><br>

    <input type="text"
           id="created_by"
           placeholder="Enter your name" />

    <br><br>

    <div class="card input-box">

        <input type="text"
               id="user-input"
               placeholder="Click Send to begin guided runbook creation"
               disabled />

        <br><br>

        <button onclick="sendMessage()" id="sendBtn">
            Send
        </button>

        <button onclick="generateDoc()" id="genBtn" disabled="disabled">
            Generate Runbook
        </button>

        <br><br>

        <div class="card chat-box" id="chat-box"></div>

        <p id="status-msg"
           style="display:none; color:blue;">
            Generating runbook... please wait.
        </p>

    </div>

    <div class="card output-box" id="output">

        <h3>📄 Generated Runbook</h3>

        <div id="doc-content"></div>

        <p>
            <b>Confluence Link:</b>
            <a id="doc-link" target="_blank"></a>
        </p>

    </div>

</div>

<style>

.chat-box {
    height: 350px;
    overflow-y: auto;
}

.output-box {
    display: none;
    max-height: 500px;
    overflow-y: auto;
}

#doc-content {
    white-space: normal;
}

</style>

<script>

let started = false;
let workflowCompleted = false;

function appendMessage(sender, text) {

    let chat = document.getElementById("chat-box");

    let msg = document.createElement("p");

    msg.innerHTML =
        "<b>" + sender + ":</b> "
        + text.replace(/\n/g, "<br>");

    chat.appendChild(msg);

    chat.scrollTop = chat.scrollHeight;
}

function lockMetadataFields() {

    document.getElementById("runbook-type").disabled = true;
    document.getElementById("runbook_title").disabled = true;
    document.getElementById("created_by").disabled = true;
}

function sendMessage() {

    let runbookType =
        document.getElementById("runbook-type").value;

    let runbookTitle =
        document.getElementById("runbook_title").value;

    let createdBy =
        document.getElementById("created_by").value;

    let input =
        document.getElementById("user-input");

    let message =
        input.value.trim();

    // =====================================================
    // START FLOW
    // =====================================================

    if (!started) {

        if (!runbookTitle) {
            alert("Please enter runbook title");
            return;
        }

        if (!createdBy) {
            alert("Please enter your name");
            return;
        }

        started = true;

        lockMetadataFields();

        input.disabled = false;

        input.placeholder = "Answer the guided question...";

        fetch("/process_doc_chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: "",
                runbook_type: runbookType,
                runbook_title: runbookTitle
            })

        })
        .then(res => res.json())
        .then(data => {

            appendMessage(
                "IntelliIQ AI",
                data.reply + "<br><i>(" + data.progress + ")</i>"
            );

        });

        return;
    }

    // =====================================================
    // VALIDATE EMPTY
    // =====================================================

    if (!message) {

        alert("Please enter your response");

        return;
    }

    appendMessage("You", message);

    input.value = "";

    fetch("/process_doc_chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message,
            runbook_type: runbookType,
            runbook_title: runbookTitle
        })

    })
    .then(res => res.json())
    .then(data => {

        appendMessage(
            "IntelliIQ AI",
            data.reply + "<br><i>(" + data.progress + ")</i>"
        );

        if (data.progress === "Workflow completed") {

            workflowCompleted = true;

            document.getElementById("genBtn").disabled = false;

            input.disabled = true;

            input.placeholder = "Workflow completed";
        }

    });
}

function generateDoc() {

    if (!workflowCompleted) {

        alert("Please complete the workflow first");

        return;
    }

    let createdBy =
        document.getElementById("created_by").value;

    let runbookType =
        document.getElementById("runbook-type").value;

    let runbookTitle =
        document.getElementById("runbook_title").value;

    let status =
        document.getElementById("status-msg");

    let btn =
        document.getElementById("genBtn");

    status.style.display = "block";

    btn.disabled = true;

    fetch("/generate_process_doc", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            created_by: createdBy,
            runbook_type: runbookType,
            runbook_title: runbookTitle

        })

    })
    .then(res => res.json())
    .then(data => {

        status.style.display = "none";

        document.getElementById("output").style.display = "block";

        document.getElementById("doc-content").innerHTML =
            "<p style='color:green; font-weight:bold;'>Runbook generated successfully.</p>";

        if (data.link) {

            document.getElementById("doc-link").href =
                data.link;

            document.getElementById("doc-link").textContent =
                "Open Runbook";
        }

    })
    .catch(err => {

        console.error("Error:", err);

        alert("Runbook generation failed");

        status.style.display = "none";

        btn.disabled = false;
    });
}

document.getElementById("user-input")
.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }

});

</script>

{% endblock %}
